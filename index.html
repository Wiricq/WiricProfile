<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>wiric — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060b08;
            --card-bg: rgba(10, 20, 14, 0.76);
            --card-border: rgba(46, 232, 92, 0.25);
            --accent-green: #2ee85c;
            --accent-lime: #7aff47;
            --accent-purple: #8b3dff;
            --text-main: #f0fdf4;
            --text-muted: #94b8a0;
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            overflow-x: hidden;
            position: relative;
            transition: padding 0.35s var(--ease-smooth);
        }

        /* Живий фон theme.jpg, який плавно рухається за курсором миші */
        .live-bg {
            position: fixed;
            inset: -45px;
            background-image: 
                linear-gradient(to bottom, rgba(6, 11, 8, 0.62), rgba(6, 11, 8, 0.84)),
                url('theme.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            will-change: transform;
            transform: translate3d(0px, 0px, 0) scale(1.06);
            transition: transform 0.25s var(--ease-smooth);
        }

        .bg-glow-1, .bg-glow-2 {
            position: fixed;
            border-radius: 50%;
            filter: blur(115px);
            z-index: -1;
            pointer-events: none;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        .bg-glow-1 {
            width: 390px;
            height: 390px;
            background: rgba(46, 232, 92, 0.24);
            top: -80px;
            left: -80px;
        }

        .bg-glow-2 {
            width: 350px;
            height: 350px;
            background: rgba(139, 61, 255, 0.22);
            bottom: -80px;
            right: -60px;
            animation-delay: -6s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(15px, -12px) scale(1.06); }
            100% { transform: translate(28px, 22px) scale(1.12); }
        }

        @keyframes cardReveal {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: max-width 0.4s var(--ease-smooth), gap 0.35s var(--ease-smooth);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardReveal 0.75s var(--ease-smooth) both;
            transition: border-color 0.35s var(--ease-smooth), box-shadow 0.35s var(--ease-smooth), padding 0.35s var(--ease-smooth);
        }

        .card:hover {
            border-color: rgba(46, 232, 92, 0.38);
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.72), 0 0 24px rgba(46, 232, 92, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .player-card {
            animation-delay: 0.1s;
        }

        .socials-grid {
            animation-delay: 0.2s;
        }

        /* Картка профілю — квадрат/область для польоту бульбашок */
        .profile-card {
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 290px;
            overflow: hidden;
        }

        .avatar-stage {
            position: relative;
            width: 136px;
            height: 136px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 14px;
            z-index: 3;
        }

        .avatar-wrapper {
            position: relative;
            width: 122px;
            height: 122px;
            z-index: 3;
            transition: transform 0.45s var(--ease-spring);
        }

        .avatar-wrapper:hover {
            transform: scale(1.03);
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-purple), var(--accent-lime));
            animation: spinRing 7s linear infinite;
            z-index: 0;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .avatar-img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #08120c;
            background: #0d1c13;
            display: block;
        }

        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 18px;
            height: 18px;
            background: var(--accent-green);
            border: 3px solid #08120c;
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 12px var(--accent-green);
            animation: statusPulse 2.6s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 10px var(--accent-green);
            }
            50% {
                transform: scale(1.16);
                box-shadow: 0 0 18px var(--accent-lime);
            }
        }

        .profile-text {
            position: relative;
            z-index: 4;
            pointer-events: none;
        }

        /* Рідкі інтерактивні бульбашки в межах картки профілю */
        .floating-bubble {
            position: absolute;
            top: 0;
            left: 0;
            width: 54px;
            height: 54px;
            padding: 6px;
            border-radius: 54% 46% 48% 52% / 47% 55% 45% 53%;
            background:
                radial-gradient(circle at 26% 22%, rgba(255, 255, 255, 0.76) 0%, rgba(122, 255, 71, 0.22) 26%, transparent 56%),
                radial-gradient(circle at 78% 82%, rgba(139, 61, 255, 0.36) 0%, transparent 58%),
                radial-gradient(circle at 50% 50%, rgba(46, 232, 92, 0.14) 42%, rgba(255, 255, 255, 0.32) 86%, rgba(46, 232, 92, 0.58) 100%);
            border: 1px solid rgba(255, 255, 255, 0.62);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.45),
                0 0 16px rgba(46, 232, 92, 0.26),
                inset 0 2px 9px rgba(255, 255, 255, 0.65),
                inset 0 -5px 12px rgba(46, 232, 92, 0.35);
            backdrop-filter: blur(6px) saturate(145%);
            -webkit-backdrop-filter: blur(6px) saturate(145%);
            z-index: 4;
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            will-change: transform, border-radius, box-shadow;
            transition: border-radius 0.9s var(--ease-smooth), box-shadow 0.35s var(--ease-smooth), border-color 0.35s var(--ease-smooth);
        }

        .floating-bubble:hover {
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow:
                0 12px 26px rgba(0, 0, 0, 0.5),
                0 0 22px rgba(46, 232, 92, 0.45),
                inset 0 2px 11px rgba(255, 255, 255, 0.8),
                inset 0 -5px 13px rgba(46, 232, 92, 0.45);
        }

        .floating-bubble.touched {
            border-color: rgba(122, 255, 71, 0.98);
            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.55),
                0 0 28px rgba(122, 255, 71, 0.72),
                inset 0 2px 12px rgba(255, 255, 255, 0.9),
                inset 0 -5px 14px rgba(139, 61, 255, 0.5);
        }

        .floating-bubble::before {
            content: "";
            position: absolute;
            top: 6px;
            left: 9px;
            width: 15px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.78);
            transform: rotate(-28deg);
            filter: blur(0.6px);
            z-index: 3;
            pointer-events: none;
        }

        .floating-bubble::after {
            content: "";
            position: absolute;
            bottom: 5px;
            right: 10px;
            width: 12px;
            height: 6px;
            border-radius: 50%;
            background: rgba(122, 255, 71, 0.55);
            transform: rotate(-20deg);
            filter: blur(1px);
            z-index: 3;
            pointer-events: none;
        }

        .floating-bubble .bubble-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(46, 232, 92, 0.58), rgba(139, 61, 255, 0.58));
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        .floating-bubble img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            transition: transform 0.4s var(--ease-smooth);
        }

        .nickname {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, var(--accent-lime));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .bio {
            font-size: 14px;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 0.3px;
        }

        /* Музичний плеєр */
        .player-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent-green);
            font-weight: 600;
        }

        .track-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            cursor: pointer;
            transition: all 0.4s var(--ease-spring);
        }

        .dot:hover {
            background: rgba(46, 232, 92, 0.55);
            transform: scale(1.2);
        }

        .dot.active {
            width: 22px;
            border-radius: 99px;
            background: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
        }

        .player-main {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        /* Карусель із 3 вінілових дисків з обкладинками */
        .vinyl-stack {
            position: relative;
            width: 108px;
            height: 80px;
            flex-shrink: 0;
        }

        .vinyl-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            transition: transform 0.65s var(--ease-spring),
                        opacity 0.5s var(--ease-smooth),
                        filter 0.5s var(--ease-smooth);
            cursor: pointer;
        }

        .vinyl-item[data-pos="0"] {
            transform: translateX(0px) scale(1);
            z-index: 3;
            opacity: 1;
            filter: brightness(1);
        }

        .vinyl-item[data-pos="1"] {
            transform: translateX(18px) scale(0.86);
            z-index: 2;
            opacity: 0.82;
            filter: brightness(0.78);
        }

        .vinyl-item[data-pos="2"] {
            transform: translateX(32px) scale(0.72);
            z-index: 1;
            opacity: 0.55;
            filter: brightness(0.58);
        }

        .vinyl-item[data-pos="1"]:hover {
            transform: translateX(23px) scale(0.9);
            opacity: 0.96;
        }

        .vinyl-disc {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, #111 0%, #111 22%, #1e2923 23%, #0a0f0c 45%, #19261e 65%, #070b09 100%);
            border: 2px solid rgba(46, 232, 92, 0.55);
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.75), 0 0 18px rgba(46, 232, 92, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: spinVinyl 5s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-item[data-pos="0"] .vinyl-disc.playing {
            animation-play-state: running;
        }

        @keyframes spinVinyl {
            100% { transform: rotate(360deg); }
        }

        .vinyl-cover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            z-index: 1;
        }

        .vinyl-grooves {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: 
                repeating-radial-gradient(
                    circle at center,
                    rgba(0, 0, 0, 0.16) 0px,
                    rgba(0, 0, 0, 0.16) 1px,
                    transparent 1.5px,
                    transparent 4px
                ),
                radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.38) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .vinyl-center {
            position: relative;
            z-index: 3;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(10, 20, 14, 0.85);
            border: 1.5px solid rgba(46, 232, 92, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .vinyl-hole {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #060b08;
        }

        .track-info {
            flex: 1;
            min-width: 0;
            transition: opacity 0.35s var(--ease-smooth), transform 0.35s var(--ease-smooth);
        }

        .track-info.switching {
            opacity: 0;
            transform: translateY(8px);
        }

        .track-title {
            font-weight: 700;
            font-size: 16px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Повзунок часу пісні (Timeline) */
        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Управління плеєром */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 2px;
        }

        .buttons-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            background: rgba(46, 232, 92, 0.12);
            border: 1px solid rgba(46, 232, 92, 0.28);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s var(--ease-spring), background 0.25s ease, border-color 0.25s ease;
        }

        .ctrl-btn:hover {
            background: rgba(46, 232, 92, 0.25);
            border-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .ctrl-btn:active {
            transform: scale(0.93);
        }

        .ctrl-btn.play-btn {
            width: 44px;
            height: 44px;
            background: var(--accent-green);
            color: #041008;
            border: none;
            box-shadow: 0 0 18px rgba(46, 232, 92, 0.45);
        }

        .ctrl-btn.play-btn:hover {
            background: var(--accent-lime);
            transform: scale(1.08);
            box-shadow: 0 0 24px rgba(122, 255, 71, 0.55);
        }

        .ctrl-btn.play-btn:active {
            transform: scale(0.95);
        }

        /* Регулятор гучності */
        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 140px;
            touch-action: none;
        }

        .volume-icon {
            color: var(--accent-green);
            flex-shrink: 0;
            transition: transform 0.25s var(--ease-spring);
        }

        .volume-box:hover .volume-icon {
            transform: scale(1.12);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            touch-action: none;
            transition: background 0.25s ease;
        }

        input[type="range"]:hover {
            background: rgba(255, 255, 255, 0.26);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            cursor: pointer;
            transition: transform 0.25s var(--ease-spring), box-shadow 0.25s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            box-shadow: 0 0 14px var(--accent-lime);
        }

        /* Сітка соцмереж */
        .socials-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            transition: grid-template-columns 0.35s var(--ease-smooth);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.35s var(--ease-spring), border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.015);
            border-color: var(--accent-green);
            background: rgba(18, 36, 25, 0.9);
            box-shadow: 0 12px 26px rgba(46, 232, 92, 0.2);
        }

        .social-link:active {
            transform: translateY(-1px) scale(0.98);
        }

        .social-link:hover .social-icon {
            transform: scale(1.1) rotate(-3deg);
        }

        .social-link.full-width {
            grid-column: span 2;
            justify-content: center;
            background: linear-gradient(135deg, rgba(16, 34, 23, 0.85), rgba(34, 18, 56, 0.72));
            border-color: rgba(139, 61, 255, 0.35);
        }

        .social-link.full-width:hover {
            border-color: var(--accent-lime);
            box-shadow: 0 12px 30px rgba(139, 61, 255, 0.28);
        }

        .social-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: transform 0.35s var(--ease-spring);
        }

        .tg-bg { background: rgba(34, 158, 217, 0.18); color: #38bdf8; }
        .steam-bg { background: rgba(102, 192, 244, 0.18); color: #66c0f4; }
        .tiktok-bg { background: rgba(255, 255, 255, 0.12); color: #ffffff; }
        .insta-bg { background: rgba(236, 72, 153, 0.2); color: #f472b6; }
        .discord-bg { background: rgba(88, 101, 242, 0.2); color: #818cf8; }
        .spotify-bg { background: rgba(30, 215, 96, 0.2); color: #2ee85c; }
        .anon-bg { background: rgba(139, 61, 255, 0.24); color: #c084fc; }

        /* Фінальна фраза внизу */
        .footer-quote {
            text-align: center;
            margin-top: 4px;
            padding: 6px 12px;
            font-size: 13px;
            font-style: italic;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            text-shadow: 0 0 14px rgba(46, 232, 92, 0.35);
            opacity: 0.88;
            animation: cardReveal 0.9s var(--ease-smooth) 0.28s both, gentleFloat 5s ease-in-out 1s infinite alternate;
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0px); opacity: 0.82; }
            100% { transform: translateY(-3px); opacity: 1; }
        }

        /* Горизонтальний поворот телефона (landscape) — акуратне компонування всіх меню */
        @media (orientation: landscape) and (max-height: 560px) {
            body {
                align-items: flex-start;
                padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            }

            .container {
                max-width: 780px;
                display: grid;
                grid-template-columns: 1fr 1.15fr;
                gap: 14px;
                align-items: start;
            }

            .profile-card {
                padding: 18px;
                min-height: 245px;
            }

            .avatar-stage {
                width: 112px;
                height: 112px;
                margin-bottom: 10px;
            }

            .avatar-wrapper {
                width: 98px;
                height: 98px;
            }

            .player-card {
                padding: 18px;
                gap: 12px;
            }

            .socials-grid {
                grid-column: span 2;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .social-link {
                padding: 12px 14px;
            }

    <script>
        const tracks = [
            {
                title: "My Baby's Got to Go",
                artist: "Aircraft",
                file: "track2.mp3"
            },
            {
                title: "Rats",
                artist: "Joy Again",
                file: "track1.mp3"
            },
            {
                title: "Целовались",
                artist: "CUPSIZE",
                file: "track3.mp3"
            }
        ];

        const bubbleSets = [
            ["bubbles/1.jpg", "bubbles/1.png", "3fe07a1f3674c306a9ce7db0a979288b.jpg"],
            ["bubbles/2.jpg", "bubbles/2.png", "baad3f437c669988a46e1eb7154bb7da.jpg"],
            ["bubbles/3.jpg", "bubbles/3.png", "Снимок экрана 2026-11-21 125249.jpg"],
            ["bubbles/4.jpg", "bubbles/4.png", "3201639972addd102063598302447e86.jpg"],
            ["bubbles/5.jpg", "bubbles/5.png", "7c558fecf974fdd69f9a71889a5c96b1.jpg"],
            ["bubbles/6.jpg", "bubbles/6.png", "42660f4230284889c767ac78a6241000.jpg"]
        ];

        const morphShapes = [
            "55% 45% 47% 53% / 46% 56% 44% 54%",
            "46% 54% 55% 45% / 53% 47% 52% 48%",
            "53% 47% 45% 55% / 48% 52% 46% 54%",
            "48% 52% 53% 47% / 55% 45% 54% 46%",
            "56% 44% 49% 51% / 45% 55% 48% 52%"
        ];

        let currentTrack = 0;
        let isPlaying = false;

        const audio = document.getElementById('audioPlayer');
        const vinylItems = document.querySelectorAll('.vinyl-item');
        const vinylDiscs = document.querySelectorAll('.vinyl-disc');
        const trackInfo = document.getElementById('trackInfo');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const dots = document.querySelectorAll('.dot');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const liveBg = document.getElementById('liveBg');
        const profileCard = document.getElementById('profileCard');
        const avatarWrapper = document.getElementById('avatarWrapper');

        let audioCtx = null;
        let gainNode = null;
        let currentVolume = 0.7;

        function initWebAudioGain() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                    const source = audioCtx.createMediaElementSource(audio);
                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = currentVolume;
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        audio.src = tracks[0].file;
        audio.volume = currentVolume;

        function loadBubbleCandidate(img, fallbackEl, candidates, idx) {
            if (idx >= candidates.length) {
                img.style.display = 'none';
                fallbackEl.style.display = 'block';
                return;
            }
            img.src = candidates[idx];
            img.onload = function () {
                img.style.display = 'block';
                fallbackEl.style.display = 'none';
            };
            img.onerror = function () {
                loadBubbleCandidate(img, fallbackEl, candidates, idx + 1);
            };
        }

        const bubbles = [];

        function tapBubble(bubble, clientX, clientY) {
            const rect = bubble.el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            let dx = cx - clientX;
            let dy = cy - clientY;
            const len = Math.hypot(dx, dy);

            if (len > 0.001) {
                dx /= len;
                dy /= len;
            } else {
                const randAngle = Math.random() * Math.PI * 2;
                dx = Math.cos(randAngle);
                dy = Math.sin(randAngle);
            }

            bubble.vx += dx * 2.2;
            bubble.vy += dy * 2.2;
            bubble.jellyPhase = 0.01;
            bubble.jellyAmp = 0.28;
            bubble.shapeIndex = (bubble.shapeIndex + 1) % morphShapes.length;
            bubble.el.style.borderRadius = morphShapes[bubble.shapeIndex];
            bubble.el.classList.add('touched');

            clearTimeout(bubble.touchTimer);
            bubble.touchTimer = setTimeout(() => {
                bubble.el.classList.remove('touched');
            }, 450);
        }

        const startPositions = [
            { rx: 0.16, ry: 0.22 },
            { rx: 0.84, ry: 0.22 },
            { rx: 0.13, ry: 0.56 },
            { rx: 0.87, ry: 0.56 },
            { rx: 0.20, ry: 0.84 },
            { rx: 0.80, ry: 0.84 }
        ];

        bubbleSets.forEach((candidates, i) => {
            const el = document.createElement('div');
            el.className = 'floating-bubble';

            const fallbackEl = document.createElement('div');
            fallbackEl.className = 'bubble-fallback';
            fallbackEl.style.display = 'none';

            const img = document.createElement('img');
            img.alt = `bubble ${i + 1}`;
            loadBubbleCandidate(img, fallbackEl, candidates, 0);

            el.appendChild(fallbackEl);
            el.appendChild(img);
            profileCard.appendChild(el);

            const angle = (i / bubbleSets.length) * Math.PI * 2 + 0.4;
            const speed = 0.44 + (i % 3) * 0.12;

            const bubble = {
                el,
                img,
                x: null,
                y: null,
                initRx: startPositions[i].rx,
                initRy: startPositions[i].ry,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                baseSpeed: speed,
                phase: i * 1.2,
                shapeIndex: i % morphShapes.length,
                lastShapeTick: i * 40,
                jellyPhase: 0,
                jellyAmp: 0,
                touchTimer: null
            };

            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                tapBubble(bubble, e.clientX, e.clientY);
            });

            bubbles.push(bubble);
        });

        let tick = 0;
        function animateBubbles() {
            tick += 1;
            const cardW = profileCard.clientWidth;
            const cardH = profileCard.clientHeight;
            const bRadius = 27;
            const pad = 12;

            const avCenterX = avatarWrapper.offsetLeft + avatarWrapper.offsetWidth / 2;
            const avCenterY = avatarWrapper.offsetTop + avatarWrapper.offsetHeight / 2;
            const avRadius = avatarWrapper.offsetWidth / 2;
            const bounceDist = avRadius + bRadius + 4;

            bubbles.forEach((b) => {
                if (b.x === null || b.y === null) {
                    b.x = cardW * b.initRx;
                    b.y = cardH * b.initRy;
                }

                let dx = b.x - avCenterX;
                let dy = b.y - avCenterY;
                let dist = Math.hypot(dx, dy);
                const pushZone = bounceDist + 10;

                if (dist < pushZone) {
                    const safeDist = dist > 0.001 ? dist : 1;
                    const nx = dx / safeDist;
                    const ny = dy / safeDist;
                    const closeness = (pushZone - dist) / 10;
                    b.vx += nx * 0.14 * closeness;
                    b.vy += ny * 0.14 * closeness;
                }

                b.vx += Math.cos(tick * 0.015 + b.phase) * 0.008;
                b.vy += Math.sin(tick * 0.013 + b.phase) * 0.008;

                const curSpeed = Math.hypot(b.vx, b.vy);
                if (curSpeed > b.baseSpeed * 2.2) {
                    b.vx *= 0.95;
                    b.vy *= 0.95;
                } else if (curSpeed < b.baseSpeed * 0.65 && curSpeed > 0.001) {
                    b.vx *= 1.02;
                    b.vy *= 1.02;
                }

                b.x += b.vx;
                b.y += b.vy;

                dx = b.x - avCenterX;
                dy = b.y - avCenterY;
                dist = Math.hypot(dx, dy);
                if (dist < bounceDist) {
                    const safeDist = dist > 0.001 ? dist : 1;
                    const nx = dx / safeDist;
                    const ny = dy / safeDist;
                    b.x = avCenterX + nx * bounceDist;
                    b.y = avCenterY + ny * bounceDist;

                    const dot = b.vx * nx + b.vy * ny;
                    if (dot < 0) {
                        b.vx -= 2.1 * dot * nx;
                        b.vy -= 2.1 * dot * ny;
                    }
                    const minOutward = Math.max(0.65, b.baseSpeed * 1.15);
                    const newDot = b.vx * nx + b.vy * ny;
                    if (newDot < minOutward) {
                        b.vx += (minOutward - newDot) * nx;
                        b.vy += (minOutward - newDot) * ny;
                    }
                }

                const minX = pad + bRadius;
                const maxX = Math.max(minX + 10, cardW - pad - bRadius);
                const minY = pad + bRadius;
                const maxY = Math.max(minY + 10, cardH - pad - bRadius);

                if (b.x < minX) {
                    b.x = minX;
                    b.vx = Math.abs(b.vx);
                } else if (b.x > maxX) {
                    b.x = maxX;
                    b.vx = -Math.abs(b.vx);
                }

                if (b.y < minY) {
                    b.y = minY;
                    b.vy = Math.abs(b.vy);
                } else if (b.y > maxY) {
                    b.y = maxY;
                    b.vy = -Math.abs(b.vy);
                }

                let jellyX = 1;
                let jellyY = 1;
                if (b.jellyAmp > 0.002) {
                    b.jellyPhase += 0.28;
                    const wave = Math.sin(b.jellyPhase) * b.jellyAmp;
                    jellyX = 1 + wave;
                    jellyY = 1 - wave * 0.85;
                    b.jellyAmp *= 0.93;
                }

                const liquidBreath = 0.96 + 0.06 * Math.sin(tick * 0.03 + b.phase);
                const scaleX = liquidBreath * jellyX;
                const scaleY = liquidBreath * jellyY;

                const imgDriftX = Math.cos(tick * 0.03 + b.phase) * 2.2;
                const imgDriftY = Math.sin(tick * 0.025 + b.phase) * 2.2;

                if (tick - b.lastShapeTick >= 75) {
                    b.lastShapeTick = tick;
                    b.shapeIndex = (b.shapeIndex + 1) % morphShapes.length;
                    b.el.style.borderRadius = morphShapes[b.shapeIndex];
                }

                b.el.style.transform = `translate3d(${(b.x - bRadius).toFixed(1)}px, ${(b.y - bRadius).toFixed(1)}px, 0) scale(${scaleX.toFixed(3)}, ${scaleY.toFixed(3)})`;
                b.img.style.transform = `translate3d(${imgDriftX.toFixed(1)}px, ${imgDriftY.toFixed(1)}px, 0)`;
            });

            requestAnimationFrame(animateBubbles);
        }
        animateBubbles();

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 24;
            const y = (e.clientY / window.innerHeight - 0.5) * 24;
            liveBg.style.transform = `translate3d(${x}px, ${y}px, 0) scale(1.06)`;
        });

        window.addEventListener('orientationchange', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateVinylPositions() {
            vinylItems.forEach((item, index) => {
                const pos = (index - currentTrack + tracks.length) % tracks.length;
                item.setAttribute('data-pos', pos);
            });
        }

        function updatePlayUI(playing) {
            isPlaying = playing;
            vinylDiscs.forEach((disc, index) => {
                if (playing && index === currentTrack) {
                    disc.classList.add('playing');
                } else {
                    disc.classList.remove('playing');
                }
            });

            if (playing) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        function togglePlay() {
            initWebAudioGain();
            if (isPlaying) {
                audio.pause();
                updatePlayUI(false);
            } else {
                audio.play().then(() => {
                    updatePlayUI(true);
                }).catch(err => {
                    console.warn("Файл " + tracks[currentTrack].file + " не знайдено у папці:", err);
                });
            }
        }

        function loadTrack(index, autoPlay = true) {
            initWebAudioGain();
            currentTrack = (index + tracks.length) % tracks.length;

            updateVinylPositions();
            dots.forEach((d, i) => d.classList.toggle('active', i === currentTrack));

            trackInfo.classList.add('switching');

            setTimeout(() => {
                trackTitle.textContent = tracks[currentTrack].title;
                trackArtist.textContent = tracks[currentTrack].artist;
                audio.src = tracks[currentTrack].file;
                seekSlider.value = 0;
                currentTimeEl.textContent = "0:00";
                trackInfo.classList.remove('switching');

                if (autoPlay) {
                    audio.play().then(() => {
                        updatePlayUI(true);
                    }).catch(() => {
                        updatePlayUI(false);
                    });
                } else {
                    updatePlayUI(false);
                }
            }, 220);
        }

        function nextTrack() {
            loadTrack(currentTrack + 1, true);
        }

        function prevTrack() {
            loadTrack(currentTrack - 1, true);
        }

        function selectTrack(index) {
            if (index !== currentTrack) {
                loadTrack(index, true);
            }
        }

        function changeVolume(val) {
            currentVolume = parseFloat(val);
            initWebAudioGain();
            if (gainNode) {
                gainNode.gain.setValueAtTime(currentVolume, audioCtx.currentTime);
            }
            try {
                audio.volume = currentVolume;
            } catch (e) {}
        }

        function seekAudio(val) {
            if (!isNaN(audio.duration)) {
                audio.currentTime = (val / 100) * audio.duration;
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const progress = (audio.currentTime / audio.duration) * 100;
                seekSlider.value = progress;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            nextTrack();
        });
    </script>
</body>
</html>
